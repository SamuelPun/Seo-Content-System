[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "seo-content-system"
version = "0.1.0"
description = "AI-assisted SEO content production pipeline"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.9",
    "yake>=0.4",
    "ddgs>=1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
]

[project.scripts]
run-workflow = "seo_system.cli.workflow:main"
onboard-client = "seo_system.cli.onboard:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501"]               # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
